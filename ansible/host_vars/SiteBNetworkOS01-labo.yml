---
# Host-specific variables for SiteBNetworkOS01-labo

interfaces:
  - name: eth0
    description: COR-NIC01
    address: 172.16.0.20/24
  - name: eth1
    description: INT-NIC01
    address: 172.16.200.1/24
  - name: eth2
    description: MGMT-NIC01
    address: 192.168.255.31/24

static_routes: []

ospf:
  enabled: true
  router_id: 172.16.0.20
  areas:
    - id: 0
      networks:
        - 172.16.0.0/24
        - 172.16.200.0/24
