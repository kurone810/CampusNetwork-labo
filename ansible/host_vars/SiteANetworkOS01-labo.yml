---
# Host-specific variables for SiteANetworkOS01-labo

# Interface mapping
# eth0: COR-NIC01 (core)
# eth1: INT-NIC01 (site A internal)
# eth2: MGMT-NIC01 (management via MGMTSW)
interfaces:
  - name: eth0
    description: COR-NIC01
    address: 172.16.0.10/24
  - name: eth1
    description: INT-NIC01
    address: 172.16.100.1/24
  - name: eth2
    description: MGMT-NIC01
    address: 192.168.255.21/24

# Static routes
static_routes: []

# OSPF configuration
ospf:
  enabled: true
  router_id: 172.16.0.10
  areas:
    - id: 0
      networks:
        - 172.16.0.0/24
        - 172.16.100.0/24
