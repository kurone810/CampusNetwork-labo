---
# Host-specific variables for SiteANetworkOS02-labo

interfaces:
  - name: eth0
    description: COR-NIC01
    address: 172.16.0.11/24
  - name: eth1
    description: INT-NIC01
    address: 172.16.100.2/24
  - name: eth2
    description: MGMT-NIC01
    address: 192.168.255.22/24

static_routes: []

ospf:
  enabled: true
  router_id: 172.16.0.11
  areas:
    - id: 0
      networks:
        - 172.16.0.0/24
        - 172.16.100.0/24
